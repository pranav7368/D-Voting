<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>D-Voting - Result</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<main>
  <header>
    <h1 id="election-name">Result</h1>
    <span class="tag">D-Voting</span>
    <nav>
      <button data-href="/vote">Vote</button>
      <button data-href="/verify">Verify</button>
      <button aria-current="true">Results</button>
      <button data-href="/chain">Chain</button>
    </nav>
  </header>

  <section id="content">
    <div class="card"><span class="spinner"></span>Loading...</div>
  </section>

  <p class="note">
    The result is not an announcement. It is sealed on the chain together with
    every trustee's decryption proof, so anyone can redo the count from that
    record. The checks below are exactly that recount, not a claim by this server.
  </p>
</main>

<script type="module" src="/results-page.js"></script>
</body>
</html>
